<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>s.CarInstallment </title>
       <link rel="stylesheet" href="css/bootstrap.min.css">
       <link rel="stylesheet" href="home.css">
</head>
<body class="min-vh-100 ">
   
   
    <div class="d-flex justify-content-center align-items-center container">
    <h1 class=" mb-1  fw-bold" id="h1">Qasetha</h1>
    </div>
   
    
    <div  class="card bg-light d-flex justify-content-center align-items-center flex-column mt-2 p-4 rounded-4 bg-opacity-50 shadow-lg w-50  ms-auto me-5">
        <h1 > Car Details</h1>
         <form class="d-flex flex-column w-75 gap-2">
                    <div  class="form-group">
                     <label for="Car model"class="fw-bold ">Car Model</label>
                    <input type="text" id=" Car model" class="form-control mt-2 mb-3" placeholder="Car Model" required> 
                    </div>
            
                      <div class="form-group">
                     <label for="Model year"class="fw-bold " > Model Year</label>
                    <input type="text" id=" Model year" class="form-control mt-2 mb-3" placeholder="Model Year" required> 
                    </div>

                    <div class="form-group">
                     <label for="Car Price"class="fw-bold"> Car Price</label>
                    <input type="text" id="Car Price" class="form-control mt-2 mb-3" placeholder="Car Price" required> 
                    </div>
                    <div class="form-group">
                     <label for="Down Payment"class="fw-bold"> Down Payment</label>
                    <input type="text" id="Down Payment" class="form-control mt-2 mb-3" placeholder="Down Payment" required> 
                    </div>
                       <label for="Installment Period"class="fw-bold"> Installment Period</label>
                    <input type="number"    min="0" id="Installment Period" class="form-control mt-2 mb-3" placeholder="Installment Period" required> 
                    </div>
                    
                    

                    

               
        </form>
       
    </div>


</body>
