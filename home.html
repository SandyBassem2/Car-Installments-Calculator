<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>s.CarInstallment </title>
       <link rel="stylesheet" href="css/bootstrap.min.css">
       <link rel="stylesheet" href="home.css">
</head>
<body class="min-vh-100 ">
   
   
    <div class="d-flex justify-content-center align-items-center container">
    <h1 class=" mb-1  fw-bold" id="h1">Qasetha</h1>
    </div>
   
    
    <div  class="card bg-light d-flex justify-content-center align-items-center flex-column mt-2 p-4 rounded-4 bg-opacity-50 shadow-lg w-50  ms-auto me-5">
        <h1 > Car Details</h1>
         <form class="d-flex flex-column w-75 gap-2">
                    <div  class="form-group" >
                     <label for="Carmodel"class="fw-bold ">Car Model</label>
                    <input type="text" id=" Carmodel" class="form-control mt-2 mb-3" placeholder="Car Model" required> 
                    </div>
            
                      <div class="form-group">
                     <label for="Modelyear"class="fw-bold " > Model Year</label>
                    <input type="text" id=" Modelyear" class="form-control mt-2 mb-3" placeholder="Model Year" required> 
                    </div>

                    <div class="form-group"id="Price">
                     <label for="CarPrice"class="fw-bold"> Car Price</label>
                    <input type="text" id="CarPrice" class="form-control mt-2 mb-3" placeholder="Car Price" required> 
                    </div>
                    <div class="form-group">
                     <label for="DownPayment"class="fw-bold"> Down Payment</label>
                    <input type="text" id="DownPayment" class="form-control mt-2 mb-3" placeholder="Down Payment" required> 
                    </div>
                    <div class="form-group">
                       <label for="InstallmentPeriod"class="fw-bold"> Installment Period</label>
                    <input type="number" min="1" max="7"id="InstallmentPeriod" class="form-control mt-2 mb-3" placeholder="Installment Period" required> 
                    </div>
               
        </form>
        
        <div id="output" class=" card p-3 rounded-4 w-75 mb-3 ">
            <h1 class=" fs-2 w-100 mb-3 "> Monthely Installment </h1>
            <p id="MonthelyInstallment" class="fs-5 mb-3">Monthely Installment</p>
            <p id="InstallmentRate" class="fs-5" > Installment Rate</p>


        </div>
       
    </div>

<script src="home.js"></script>
</body>
</html>
